<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="catalogo-remoto" content="1">
<meta name="description" content="Catálogo de fotos das marcas e referências da Calçados 24h. Veja e baixe as fotos dos modelos.">
<title>Catálogo · Calçados 24h</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&display=swap" rel="stylesheet">
<style>
:root{--preto:#0d0d0d;--grafite:#1a1a1a;--cinza:#2a2a2a;--c2:#8c8c8c;--c3:#bdbdbd;--pag:#fbfaf7;--pag2:#f0eeea;--linha:#e2dfd9;--tinta:#111;--verm:#e30613;--sb:300px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Archivo",system-ui,sans-serif;background:var(--preto);color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block}
.wide{font-stretch:125%;font-weight:900;text-transform:uppercase;letter-spacing:-.02em}
.narrow{font-stretch:62%;font-weight:600;text-transform:uppercase;letter-spacing:.14em}
.num{font-variant-numeric:tabular-nums}

/* ===== sumário lateral ===== */
.sb{position:fixed;left:0;top:0;bottom:0;width:var(--sb);background:var(--grafite);border-right:1px solid #262626;display:flex;flex-direction:column;z-index:20}
.sb .logo{padding:26px 26px 18px;border-bottom:1px solid #262626}
.sb .logo .l1{font-size:11px;letter-spacing:.3em;color:var(--c2)}
.sb .logo .l2{font-size:30px;line-height:1;margin-top:6px}
.sb .logo .l2 i{font-style:normal;color:var(--verm)}
.sb .logo .l3{font-size:11px;color:var(--c2);margin-top:8px;letter-spacing:.08em}
.sb .busca{padding:14px 18px;border-bottom:1px solid #262626}
.sb input{width:100%;height:40px;background:#111;border:1px solid #333;color:#fff;padding:0 14px;font:inherit;font-size:13px;outline:none;border-radius:4px}
.sb input:focus{border-color:#777}
.sb .tit{padding:16px 26px 8px;font-size:10.5px;letter-spacing:.24em;color:var(--c2);display:flex;justify-content:space-between}
.sb .marcas{flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:#333 transparent;padding-bottom:12px}
.sb .m{display:grid;grid-template-columns:30px 1fr auto;align-items:baseline;gap:10px;padding:9px 26px;font-size:13.5px;color:#d8d8d8;border-left:3px solid transparent;transition:background .15s}
.sb .m small{color:#5c5c5c;font-size:11px}
.sb .m .pg{color:var(--c2);font-size:11px}
.sb .m:hover{background:#222}
.sb .m.on{background:#262626;border-left-color:var(--verm);color:#fff}
.sb .m.on .pg{color:var(--verm)}
.sb .rod{padding:16px 26px 22px;border-top:1px solid #262626;display:grid;gap:10px;font-size:12.5px}
.sb .zap{display:flex;align-items:center;gap:10px;height:42px;background:var(--verm);color:#fff;justify-content:center;border-radius:4px;font-weight:700}
.sb .zap svg{width:16px;height:16px}
.sb .adm{color:var(--c2);text-align:center}

/* ===== palco do livro ===== */
.palco{position:fixed;left:var(--sb);right:0;top:0;bottom:0;display:flex;flex-direction:column}
.topo{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--c2);border-bottom:1px solid #1f1f1f}
.topo b{color:#fff;font-weight:600}
.topo .ctr{display:flex;gap:18px;align-items:center}
.topo .ctr button{color:#bbb;letter-spacing:.1em;display:flex;align-items:center;gap:6px}
.topo .ctr button:hover{color:#fff}
.mesa{flex:1;display:grid;place-items:center;padding:22px 72px;min-height:0;position:relative}
.livro{position:relative;width:min(100%,calc((100vh - 54px - 44px - 44px)*1.46));aspect-ratio:1.46;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 60px 100px -40px rgba(0,0,0,.9),0 0 0 1px #000}
.livro.capa-so{grid-template-columns:1fr;width:min(100%,calc((100vh - 142px)*.73));aspect-ratio:.73;margin-left:auto;margin-right:auto}
.pagina{position:relative;background:var(--pag);color:var(--tinta);overflow:hidden;animation:virar .45s cubic-bezier(.2,.7,.2,1) both}
.pagina.esq{border-right:1px solid #d6d2ca}
.pagina.esq::after{content:"";position:absolute;right:0;top:0;bottom:0;width:60px;background:linear-gradient(to right,transparent,rgba(0,0,0,.08) 70%,rgba(0,0,0,.18))}
.pagina.dir::before{content:"";position:absolute;left:0;top:0;bottom:0;width:60px;background:linear-gradient(to left,transparent,rgba(0,0,0,.06) 70%,rgba(0,0,0,.14));z-index:1;pointer-events:none}
@keyframes virar{from{opacity:0;transform:translateX(var(--dx,20px))}to{opacity:1;transform:none}}
.pagina.esq{--dx:-20px}
.folio{position:absolute;bottom:18px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#777;display:flex;gap:14px;align-items:center;z-index:2}
.esq .folio{left:30px}.dir .folio{right:30px;flex-direction:row-reverse}
.folio b{color:#111;font-weight:700}
.cabec{position:absolute;top:20px;left:30px;right:30px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#777;z-index:2}
.cabec span:last-child{color:#111}
.seta{z-index:5;position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid #3a3a3a;display:grid;place-items:center;color:#ddd;background:rgba(13,13,13,.6);transition:background .15s,border-color .15s}
.seta:hover{background:#fff;color:#000;border-color:#fff}
.seta.e{left:12px}.seta.d{right:12px}
.seta svg{width:18px;height:18px}
.seta:disabled{opacity:.2;pointer-events:none}
.base{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c2);border-top:1px solid #1f1f1f}
.base .barra{flex:1;margin:0 26px;height:2px;background:#2a2a2a;position:relative}
.base .barra i{position:absolute;left:0;top:0;bottom:0;background:var(--verm);transition:width .3s}
.base .dica{color:#555}

/* ===== conteúdos de página ===== */
.p-capa{display:flex;flex-direction:column;background:#111;color:#fff}
.p-capa img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.p-capa::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.25) 45%,rgba(0,0,0,.35) 100%)}
.p-capa .in{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:7% 8%}
.p-capa .ed{font-size:11px;letter-spacing:.3em;color:#ddd;display:flex;justify-content:space-between}
.p-capa .ed b{color:var(--verm)}
.p-capa h1{font-size:clamp(40px,7.5vmin,86px);line-height:.88;font-stretch:125%;font-weight:900;text-transform:uppercase;letter-spacing:-.03em}
.p-capa h1 span{display:block;font-stretch:62%;font-weight:300;font-size:.26em;letter-spacing:.22em;margin-top:18px;color:#ddd;line-height:1.5}
.p-capa .rodc{display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#ccc}
.p-capa .rodc .mk{font-size:26px;font-stretch:125%;font-weight:900;letter-spacing:-.02em;line-height:1;color:#fff}
.p-capa .rodc .mk i{font-style:normal;color:var(--verm)}
.abrir{position:absolute;right:-1px;top:50%;transform:translate(100%,-50%);writing-mode:vertical-rl;font-size:10px;letter-spacing:.3em;color:#777;padding:14px 10px;text-transform:uppercase}

.p-sum{padding:72px 36px 64px}
.p-sum h2{font-size:34px;line-height:1;margin-bottom:6px}
.p-sum .sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#777;margin-bottom:26px}
.p-sum .it{display:grid;grid-template-columns:26px 1fr auto;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px dotted #c9c5bd;font-size:13px;cursor:pointer}
.p-sum .it:hover{color:var(--verm)}
.p-sum .it small{color:#999;font-size:10px}
.p-sum .it .q{color:#999;font-size:10.5px;letter-spacing:.06em}
.p-sum .it b{font-size:12px}
.p-sum .nota{margin-top:20px;font-size:11px;color:#777;line-height:1.55;max-width:40ch}

.p-hero{background:#111}
.p-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.p-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,0) 55%)}
.p-hero .in{position:absolute;left:30px;right:30px;bottom:56px;z-index:2;color:#fff}
.p-hero .cap{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#ddd;margin-bottom:10px}
.p-hero h2{font-size:clamp(30px,6vmin,74px);line-height:.9;font-stretch:125%;font-weight:900;text-transform:uppercase;letter-spacing:-.03em;word-break:break-word}
.p-hero .st{display:flex;gap:26px;margin-top:18px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#ccc}
.p-hero .st b{display:block;font-size:22px;color:#fff;letter-spacing:0;font-stretch:125%}
.p-hero .cabec,.p-hero .folio{color:#bbb}.p-hero .cabec span:last-child,.p-hero .folio b{color:#fff}

.p-grid{padding:54px 30px 52px;display:flex;flex-direction:column}
.p-grid .g{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:16px 12px;min-height:0}
.rc{display:flex;flex-direction:column;min-height:0;cursor:pointer;position:relative}
.rc .ph{flex:1;min-height:0;background:var(--pag2);overflow:hidden;position:relative}
.rc .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.rc:hover .ph img{transform:scale(1.05)}
.rc .ph .n{position:absolute;left:0;top:0;background:var(--verm);color:#fff;font-size:9px;letter-spacing:.16em;padding:3px 7px;font-weight:700}
.rc .ph .f{position:absolute;right:6px;bottom:6px;background:rgba(255,255,255,.92);font-size:10px;font-weight:700;padding:2px 6px}
.rc .mt{padding-top:7px;border-top:1px solid #111;margin-top:7px;display:flex;justify-content:space-between;align-items:baseline}
.rc .mt b{font-size:12.5px;letter-spacing:.02em}
.rc .mt small{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:6px}

.p-busca{padding:64px 32px 60px}
.p-busca h2{font-size:28px;line-height:1}
.p-busca .sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#777;margin:8px 0 22px}
.p-busca .g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.p-busca .rc .ph{aspect-ratio:4/5;flex:none}

/* ===== ficha (sobreposta como caderno) ===== */
.ficha{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:60;display:grid;place-items:center;padding:30px 72px 30px calc(var(--sb) + 72px)}
.ficha .livro{animation:sobe .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes sobe{from{opacity:0;transform:translateY(30px) scale(.98)}to{opacity:1;transform:none}}
.f-foto{background:#eee;cursor:zoom-in}
.f-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.f-foto .legenda{position:absolute;left:30px;bottom:18px;z-index:2;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#333;background:rgba(251,250,247,.9);padding:6px 10px}
.f-foto .fs{position:absolute;right:16px;top:16px;z-index:2;width:36px;height:36px;background:rgba(251,250,247,.9);display:grid;place-items:center;border-radius:4px}
.f-foto .fs svg{width:16px;height:16px}
.f-info{padding:28px 30px 56px;display:flex;flex-direction:column;gap:18px;overflow:auto;scrollbar-width:thin}
.f-info .x{position:absolute;right:20px;top:18px;width:36px;height:36px;border:1px solid #ccc;border-radius:50%;display:grid;place-items:center;z-index:3}
.f-info .x:hover{background:#111;color:#fff;border-color:#111}
.f-info .x svg{width:14px;height:14px}
.f-info .mk{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#777}
.f-info .mk a:hover{color:var(--verm)}
.f-info h2{font-size:clamp(28px,4.4vmin,46px);line-height:1;letter-spacing:-.02em;font-stretch:125%;font-weight:900}
.f-info .ref-l{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#777;margin-top:4px}
.f-info .dados{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #111;border-bottom:1px solid var(--linha)}
.f-info .dados div{padding:12px 0;border-right:1px solid var(--linha);padding-left:12px}
.f-info .dados div:first-child{padding-left:0}.f-info .dados div:last-child{border-right:0}
.f-info .dados small{display:block;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#888;margin-bottom:3px}
.f-info .dados b{font-size:14px}
.f-info .dados b.v{color:var(--verm)}
.f-info .th{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.f-info .th button{aspect-ratio:4/5;background:var(--pag2);overflow:hidden;border:2px solid transparent;opacity:.6}
.f-info .th button.on{border-color:#111;opacity:1}
.f-info .th img{width:100%;height:100%;object-fit:cover}
.f-info .acoes{display:grid;gap:8px;margin-top:auto}
.btn{height:46px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:13px;border:1px solid #111;border-radius:4px;transition:background .15s,color .15s}
.btn svg{width:15px;height:15px}
.btn-p{background:#111;color:#fff}.btn-p:hover{background:#000}
.btn-s{background:#fff}.btn-s:hover{background:var(--pag2)}
.btn-z{background:var(--verm);color:#fff;border-color:var(--verm)}.btn-z:hover{background:#c20511}
.f-info .obs{font-size:11px;color:#888;line-height:1.5}
.f-info .folio{bottom:16px}
.f-foto .pn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;background:rgba(251,250,247,.92);display:grid;place-items:center;z-index:2;border-radius:50%}
.f-foto .pn svg{width:16px;height:16px}
.f-foto .pn.a{left:14px}.f-foto .pn.b{right:14px}

/* ===== zoom ===== */
.zoom{position:fixed;inset:0;background:#000;z-index:90;display:grid;place-items:center}
.zoom img{max-width:96vw;max-height:92vh;object-fit:contain}
.zoom .ct{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#aaa}
.zoom .x{position:absolute;right:20px;top:14px;width:40px;height:40px;border:1px solid #444;border-radius:50%;display:grid;place-items:center;color:#fff}
.zoom .x svg{width:16px;height:16px}
.toast{position:fixed;left:50%;bottom:62px;transform:translateX(-50%) translateY(16px);background:#fff;color:#000;padding:10px 18px;border-radius:4px;font-size:12.5px;font-weight:700;opacity:0;transition:.25s;z-index:200;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.hidden{display:none!important}
.menu-btn{display:none}

/* ===== responsivo ===== */
@media (max-width:1100px){:root{--sb:250px}.mesa{padding:16px 60px}.ficha{padding:20px 60px 20px calc(var(--sb) + 60px)}}
@media (max-width:820px){
  :root{--sb:0px}
  body{overflow:auto}
  .sb{transform:translateX(-100%);transition:transform .3s;width:280px;z-index:80}
  .sb.aberto{transform:none}
  .menu-btn{display:flex;align-items:center;gap:8px;color:#fff}
  .menu-btn svg{width:18px;height:18px}
  .palco{left:0}
  .topo{padding:0 16px;height:50px;font-size:10px;letter-spacing:.14em}
  .topo .ctr .esc{display:none}
  .topo #t-esq{flex:1;margin:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .mesa{padding:12px 12px 8px;display:block}
  .livro,.livro.capa-so{width:100%;aspect-ratio:auto;height:calc(100vh - 50px - 44px - 20px);grid-template-columns:1fr;margin:0}
  .pagina.esq{display:none}
  .pagina.dir::before{display:none}
  .seta{top:auto;bottom:54px;width:40px;height:40px;transform:none}
  .seta.e{left:16px}.seta.d{right:16px}
  .p-grid{padding:48px 16px 48px}
  .p-grid .g{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}
  .ficha{padding:0}
  .ficha .livro{height:100vh;grid-template-rows:55% 45%}
  .ficha .pagina.esq{display:block;border:0}
  .f-info{padding:20px 16px 40px}
  .f-info .th{grid-template-columns:repeat(6,1fr)}
  .f-info .dados b{font-size:12px}
  .base #b-dir{display:none}
  .p-sum{padding:56px 20px 50px}
  .p-busca .g{grid-template-columns:repeat(2,1fr)}
  .abrir{display:none}
}
/* estados */
.estado{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:40px;color:#ddd}
.estado h2{font-size:clamp(40px,8vmin,96px);line-height:.9;margin:14px 0 16px}
.estado p{color:var(--c2);font-size:14px;max-width:44ch;margin:0 auto}
.estado .btn{display:inline-flex;margin-top:26px;padding:0 26px;background:#fff;color:#000;border-color:#fff}
.spin{width:30px;height:30px;border:3px solid #333;border-top-color:#fff;border-radius:50%;animation:gira .8s linear infinite;margin:0 auto 18px}
@keyframes gira{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,#efede8 0,#e4e1da 50%,#efede8 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.rc .ph img,.f-foto img,.p-hero img,.p-capa img{opacity:0;transition:opacity .35s}
img.ok{opacity:1!important}
.rc.vazio{visibility:hidden}
.zoom .spin{position:absolute;left:50%;top:50%;margin:-15px 0 0 -15px}
</style>
</head>
<body>

<aside class="sb" id="sb">
  <div class="logo"><div class="l1">CATÁLOGO DE FOTOS</div><div class="l2 wide">Calçados <i>24h</i></div><div class="l3 num" id="l3">&nbsp;</div></div>
  <div class="busca"><input id="q" type="search" placeholder="Buscar marca ou referência…" autocomplete="off"></div>
  <div class="tit"><span>Sumário</span><span>pág.</span></div>
  <nav class="marcas" id="sb-marcas"></nav>
  <div class="rod"><a class="adm hidden" id="link-admin" href="admin.html">Área do administrador</a></div>
</aside>

<div class="palco">
  <div class="topo">
    <button class="menu-btn" id="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Sumário</button>
    <span id="t-esq">Catálogo de fotos · <b>Edição <span id="ano"></span></b></span>
    <div class="ctr">
      <button id="ir-capa">Capa</button>
      <button id="ir-sum">Sumário</button>
      <span class="esc" style="color:#444">← → viram a página</span>
    </div>
  </div>
  <div class="mesa" id="mesa">
    <button class="seta e" id="ant" aria-label="Página anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="livro" id="livro"></div>
    <button class="seta d" id="prox" aria-label="Próxima página"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
    <div class="estado" id="estado"><div><div class="spin"></div><p>Conectando ao catálogo…</p></div></div>
  </div>
  <div class="base"><span id="b-esq" class="num"></span><div class="barra"><i id="barra"></i></div><span id="b-dir" class="num"></span></div>
</div>

<div class="ficha hidden" id="ficha"></div>
<div class="zoom hidden" id="zoom"><span class="ct" id="z-ct"></span><div class="spin" id="z-spin"></div><img id="z-img" alt=""><button class="x" id="z-x" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
<div class="toast" id="toast"></div>

<script>
/* ================= utilidades ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const compacto=s=>norm(s).replace(/[^a-z0-9]/g,'');

/* ================= dados ================= */
const S={idx:null,marcas:{}};
async function getIdx(){
  if(S.idx&&Date.now()-S.idxEm<60000)return S.idx;
  const r=await fetch(BASE+'/data/index.json',{cache:'no-cache'});if(!r.ok)throw new Error('vazio');
  const idx=await r.json();
  idx.marcas=idx.marcas.filter(m=>m.q>0&&!m.h);if(!idx.marcas.length)throw new Error('vazio');
  idx.marcas.sort((a,b)=>a.n.localeCompare(b.n,'pt-BR'));
  idx.marcas.forEach((m,i)=>m.i=i);
  S.idx=idx;S.idxEm=Date.now();S.marcas={};montarLivro();return idx;
}
async function getMarca(s){
  if(S.marcas[s]&&Date.now()-S.marcas[s]._em<60000)return S.marcas[s];
  const r=await fetch(BASE+'/data/m/'+s+'.json',{cache:'no-cache'});if(!r.ok)throw new Error('nao');
  const m=await r.json();if(m.oculta)throw new Error('nao');
  m.refs=m.refs.filter(x=>x.f&&x.f.length&&!x.oc);m._em=Date.now();return S.marcas[s]=m;
}
/* Versão do GitHub: descobre onde está o computador do catálogo agora. */
async function conectar(){
  const comTempo=(u,ms)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(u,{cache:'no-store',signal:c.signal}).finally(()=>clearTimeout(t))};
  const fontes=['servidor.json?t='+Date.now()];
  const dono=location.hostname.split('.')[0],repo=location.pathname.split('/').filter(Boolean)[0];
  if(location.hostname.endsWith('github.io')&&repo)fontes.push('https://api.github.com/repos/'+dono+'/'+repo+'/contents/servidor.json?t='+Date.now());
  const tentados=new Set();
  for(const f of fontes){try{
    const r0=await comTempo(f,8000);if(!r0.ok)continue;let j=await r0.json();
    if(j.content)j=JSON.parse(atob(j.content.replace(/\s/g,'')));
    const url=(j.url||'').replace(/\/$/,'');if(!url||tentados.has(url))continue;tentados.add(url);
    const r=await comTempo(url+'/api/ping',12000);await r.text();if(!r.ok)continue;
    BASE=url;$('#link-admin').classList.remove('hidden');return true;
  }catch(e){}}
  return false;
}

/* ================= livro (paginação) ================= */
const POR_PAG=6,SUM_POR_PAG=22;
let PAGS=[],cur=0,dir=1,buscaPag=null,render_id=0;
function montarLivro(){
  const ms=S.idx.marcas;PAGS=[{t:'capa'}];
  const nSum=Math.ceil(ms.length/SUM_POR_PAG);
  for(let k=0;k<nSum;k++)PAGS.push({t:'sum',itens:ms.slice(k*SUM_POR_PAG,(k+1)*SUM_POR_PAG),parte:k+1,n:nSum});
  ms.forEach(m=>{m.pag=PAGS.length;PAGS.push({t:'hero',m});const n=Math.max(1,Math.ceil(m.q/POR_PAG));for(let k=0;k<n;k++)PAGS.push({t:'grid',m,k:k+1,n})});
  const refs=ms.reduce((t,m)=>t+m.q,0);
  $('#l3').textContent=`${ms.length} marcas · ${num(refs)} modelos`;
  $('#b-dir').textContent=`${ms.length} marcas · ${num(refs)} modelos`;
  $('#sb-marcas').innerHTML=ms.map(m=>`<a class="m" href="#/m/${m.s}" data-s="${m.s}"><small>${pad(m.i+1)}</small><span>${esc(m.n)}</span><span class="pg num">${m.pag}</span></a>`).join('');
}
function folio(p,idx){const m=p.m;const dirTxt=m?(p.t==='hero'?'Capítulo '+pad(m.i+1):`Página ${p.k} de ${p.n}`):'Catálogo '+ANO;return `<div class="cabec"><span>${m?esc(m.n):'Calçados 24h'}</span><span>${dirTxt}</span></div><div class="folio"><b>${idx}</b><span>Calçados 24h · Catálogo</span></div>`}
function rc(r,m,comMarca){return `<div class="rc" data-ref="${m.s}|${r.s}"><div class="ph"><img data-src="${foto(r.f[0].t)}" alt="${esc(r.r)}" loading="lazy">${comMarca?'':`<span class="f">${r.f.length} fotos</span>`}</div><div class="mt"><b class="num">${esc(r.r)}</b><small>${comMarca?esc(m.n):r.f.length+' fotos'}</small></div></div>`}
function pagSkel(lado){return `<div class="pagina ${lado} p-grid"><div class="g">${'<div class="rc"><div class="ph skel"></div></div>'.repeat(6)}</div></div>`}
function pagHTML(p,idx,lado,dados){
  if(p.t==='capa'){const ms=S.idx.marcas,refs=ms.reduce((t,m)=>t+m.q,0);const mc=dados&&dados.refs&&dados.refs[0]?foto(dados.refs[0].f[0].g):(dados&&dados.c?foto(dados.c):'');
    return `<div class="pagina p-capa dir">${mc?`<img data-src="${mc}" alt="">`:''}<div class="in"><div class="ed"><span>Catálogo de fotos</span><span>Edição <b>${ANO}</b></span></div><h1>Catálogo<br>de<br>modelos<span>Lançamentos · Linha completa · ${MES} ${ANO}</span></h1><div class="rodc"><div><div class="mk">Calçados <i>24h</i></div></div><div class="num">${ms.length} marcas<br>${num(refs)} modelos</div></div></div><span class="abrir">Abrir o catálogo →</span></div>`}
  if(p.t==='sum')return `<div class="pagina p-sum ${lado}"><h2 class="wide">${p.parte===1?'Sumário':'&nbsp;'}</h2><div class="sub">${p.parte===1?'Marcas em ordem alfabética · nº da página':'continuação'}</div>${p.itens.map(m=>`<a class="it" href="#/m/${m.s}"><small>${pad(m.i+1)}</small><span>${esc(m.n)} <span class="q">· ${m.q} ${m.q===1?'modelo':'modelos'}</span></span><b class="num">${m.pag}</b></a>`).join('')}${p.parte===p.n&&p.itens.length<SUM_POR_PAG-4?`<p class="nota">Cada marca abre com uma página de capítulo e segue com as referências, das mais novas para as mais antigas. Toque numa referência para ver a ficha com todas as fotos e baixar uma ou todas.</p>`:''}${folio(p,idx)}</div>`;
  if(p.t==='hero'){const m=p.m,d=dados;const img=d&&d.refs[0]?foto(d.refs[0].f[0].g):(m.c?foto(m.c):'');const nf=d?d.refs.reduce((a,r)=>a+r.f.length,0):'—';
    return `<div class="pagina p-hero ${lado}">${img?`<img data-src="${img}" alt="">`:''}<div class="in"><div class="cap">Capítulo ${pad(m.i+1)} de ${S.idx.marcas.length}</div><h2>${esc(m.n)}</h2><div class="st"><div><b class="num">${d?d.refs.length:m.q}</b>modelos</div><div><b class="num">${nf}</b>fotos</div></div></div>${folio(p,idx)}</div>`}
  if(p.t==='grid'){const d=dados;const refs=d?d.refs.slice((p.k-1)*POR_PAG,p.k*POR_PAG):[];
    return `<div class="pagina p-grid ${lado}"><div class="g">${refs.map(r=>rc(r,p.m)).join('')}${refs.length?'':'<p style="grid-column:1/-1;font-size:12px;color:#888;align-self:center;text-align:center">Nenhuma referência nesta página.</p>'}</div>${folio(p,idx)}</div>`}
  if(p.t==='busca')return `<div class="pagina p-busca ${lado}"><h2 class="wide">Resultados</h2><div class="sub">“${esc(p.q)}” · ${p.ms.length} marcas · ${num(p.rs.length)} referências</div>${p.ms.length?`<div style="margin-bottom:16px">${p.ms.map(m=>`<a class="it" href="#/m/${m.s}" style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dotted #c9c5bd;font-size:13px"><span>${esc(m.n)}</span><b class="num">pág. ${m.pag}</b></a>`).join('')}</div>`:''}${p.rs.length?`<div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#777;margin-bottom:10px">Referências</div><div class="lista-ref">${p.rs.slice(0,40).map(([r,m])=>`<a class="it" href="#/m/${m.s}/${encodeURIComponent(slug(r))}" style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dotted #c9c5bd;font-size:13px"><b class="num">${esc(r)}</b><span style="color:#888;font-size:11px">${esc(m.n)}</span></a>`).join('')}</div>`:''}${p.rs.length>40?`<p style="font-size:11px;color:#777;margin-top:12px">Mostrando 40 de ${num(p.rs.length)}. Refine a busca.</p>`:''}${!p.ms.length&&!p.rs.length?'<p style="font-size:13px;color:#777">Nada encontrado.</p>':''}</div>`;
}
async function render(){
  const L=$('#livro'),id=++render_id;
  if(buscaPag){L.className='livro';L.innerHTML=`<div class="pagina p-sum esq"><h2 class="wide">Busca</h2><div class="sub">digite no sumário para procurar</div><p class="nota">A busca procura pelo nome da marca e pelo número da referência, ignorando acentos e pontos.</p></div>`+pagHTML(buscaPag,'—','dir');ligar();base('Resultado da busca');return}
  const pags=cur===0?[PAGS[0]]:[PAGS[cur],PAGS[cur+1]].filter(Boolean);
  // esqueleto imediato
  if(cur===0){L.className='livro capa-so';L.innerHTML=pagHTML(PAGS[0],0,'dir',null)}
  else{L.className='livro';L.innerHTML=pags.map((p,i)=>(p.m?pagSkel(i?'dir':'esq'):pagHTML(p,cur+i,i?'dir':'esq'))).join('')+(pags.length<2?'<div class="pagina dir" style="background:#e9e7e2"></div>':'')}
  imgOk(L);ligar();destacar();base();
  // carrega as marcas necessárias
  const precisa=[...new Set(pags.filter(p=>p.m).map(p=>p.m.s))];
  if(cur===0){const mcapa=S.idx.marcas.find(m=>m.c)||S.idx.marcas[0];precisa.push(mcapa.s)}
  if(!precisa.length)return;
  const dados={};
  try{await Promise.all(precisa.map(async s=>{dados[s]=await getMarca(s)}))}catch(e){if(e instanceof TypeError){CONECTADO=false;return telaOffline()}}
  if(id!==render_id)return;
  if(cur===0){const mcapa=S.idx.marcas.find(m=>m.c)||S.idx.marcas[0];L.innerHTML=pagHTML(PAGS[0],0,'dir',dados[mcapa.s]||mcapa)}
  else L.innerHTML=pags.map((p,i)=>pagHTML(p,cur+i,i?'dir':'esq',p.m?dados[p.m.s]:null)).join('')+(pags.length<2?'<div class="pagina dir" style="background:#e9e7e2"></div>':'');
  L.querySelectorAll('.pagina').forEach(p=>p.style.setProperty('--dx',(dir>0?1:-1)*(p.classList.contains('esq')?-18:18)+'px'));
  imgOk(L);ligar();
}
function destacar(){const pa=PAGS[cur]||{},pb=PAGS[cur+1]||{};const m=pb.t==='hero'?pb.m:(pa.m||pb.m);
  document.querySelectorAll('#sb-marcas .m').forEach(a=>a.classList.toggle('on',!!m&&a.dataset.s===m.s));const on=$('#sb-marcas .m.on');if(on)on.scrollIntoView({block:'nearest'});
  $('#t-esq').innerHTML=m?`${esc(m.n)} · <b>Capítulo ${pad(m.i+1)}</b>`:`Catálogo de fotos · <b>Edição ${ANO}</b>`;
  document.title=(m?m.n+' · ':'')+'Catálogo · Calçados 24h';}
function base(txt){$('#b-esq').textContent=txt||(cur===0?'Capa':`Páginas ${cur}–${Math.min(cur+1,PAGS.length-1)} de ${PAGS.length-1}`);$('#barra').style.width=(cur/Math.max(1,PAGS.length-1)*100)+'%';$('#ant').disabled=cur===0;$('#prox').disabled=cur+2>=PAGS.length}
function ligar(){document.querySelectorAll('[data-ref]').forEach(c=>c.onclick=()=>{const [ms,rs]=c.dataset.ref.split('|');location.hash='#/m/'+ms+'/'+encodeURIComponent(rs)})}
function irPag(p,semHash){buscaPag=null;$('#q').value='';dir=p>=cur?1:-1;cur=p<=0?0:(p%2?p:p-1);if(cur>=PAGS.length)cur=PAGS.length-1-((PAGS.length-1)%2?0:1);render();if(!semHash)history.replaceState(null,'',cur===0?'#/':'#/p/'+cur)}
function virar(d){if(buscaPag){buscaPag=null;$('#q').value='';render();return}let p=cur;if(d>0){p=cur===0?1:cur+2;if(p>=PAGS.length)return}else{p=cur<=1?0:cur-2}irPag(p)}

/* ================= downloads ================= */
function nomeArq(ref,i){return (ref+' - '+(i+1)).replace(/[\\/:*?"<>|]/g,'-')+'.jpg'}
async function baixarBlob(url,nome){const r=await fetch(url);if(!r.ok)throw new Error('falha');const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function carregarJSZip(){return window.JSZip?Promise.resolve():new Promise((ok,er)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=ok;s.onerror=er;document.head.appendChild(s)})}
async function baixarTodas(r,m){
  const b=$('#f-zip');if(!b||b.disabled)return;const txt=b.innerHTML;b.disabled=true;
  try{await carregarJSZip();const z=new JSZip();let feitos=0;
    await Promise.all(r.f.map(async(f,i)=>{const x=await fetch(foto(f.g));z.file(nomeArq(r.r,i),await x.blob());b.textContent='Preparando '+(++feitos)+' de '+r.f.length+'…'}));
    b.textContent='Gerando arquivo…';const blob=await z.generateAsync({type:'blob'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(m.n+' '+r.r).replace(/[\\/:*?"<>|]/g,'-')+'.zip';document.body.appendChild(a);a.click();a.remove();toast('Download iniciado');
  }catch(e){toast('Não foi possível baixar agora. Tente de novo.')}
  const bb=$('#f-zip');if(bb){bb.innerHTML=txt;bb.disabled=false}
}

/* ================= rotas / estados ================= */
function estado(html){const e=$('#estado');if(html===null){e.classList.add('hidden');return}e.classList.remove('hidden');e.innerHTML='<div>'+html+'</div>'}
function telaOffline(){estado(`<div class="narrow" style="color:var(--c2)">Catálogo Calçados 24h</div><h2 class="wide">Voltamos já</h2><p>O catálogo está temporariamente indisponível. Tente novamente em alguns minutos.</p><button class="btn" id="tentar">Tentar de novo</button>`);$('#tentar').onclick=()=>{S.idx=null;rota()}}
async function rota(){
  if(!CONECTADO){estado('<div class="spin"></div><p>Conectando ao catálogo…</p>');CONECTADO=await conectar();if(!CONECTADO)return telaOffline()}
  try{
    if(!S.idx){estado('<div class="spin"></div><p>Abrindo o catálogo…</p>');await getIdx()}
    estado(null);
    const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean).map(decodeURIComponent);
    if(p[0]==='m'&&p[1]){
      const m=S.idx.marcas.find(x=>x.s===p[1]);if(!m)throw new Error('nao');
      if(p[2]){
        const d=await getMarca(m.s);const r=d.refs.find(x=>x.s===p[2]);if(!r)throw new Error('nao');
        const pos=d.refs.indexOf(r);const pagRef=m.pag+1+Math.floor(pos/POR_PAG);
        if(!(cur>0&&(cur===pagRef||cur+1===pagRef)))irPag(pagRef,true);
        d.i=m.i;d.pag=m.pag;abrirFicha(d,r);
      }else{fecharFicha();irPag(m.pag,true);history.replaceState(null,'','#/p/'+cur)}
    }else if(p[0]==='p'&&p[1]){fecharFicha();irPag(+p[1]||0,true)}
    else{fecharFicha();irPag(0,true)}
  }catch(e){
    if(REMOTO&&e instanceof TypeError){CONECTADO=false;S.idx=null;S.marcas={};return telaOffline()}
    if(e.message==='vazio'){estado(`<h2 class="wide">Em preparação</h2><p>O catálogo ainda está sendo preparado. Volte em breve.</p>`);return}
    toast('Não encontramos essa página.');if(S.idx)irPag(0);
  }
}
window.addEventListener('hashchange',rota);
rota();
</script>
</body>
</html>
